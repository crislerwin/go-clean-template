services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
      # Envie traces para o Tempo via OpenTelemetry Collector.
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4318
      - OTEL_INSECURE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - go-clean-template

  # OpenTelemetry Collector: recebe traces da API e envia para Tempo.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP
      - "4317:4317" # OTLP gRPC
    depends_on:
      - tempo
    networks:
      - go-clean-template

  # Loki: armazena logs estruturados.
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - go-clean-template

  # Tempo: armazena traces distribuídos.
  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200" # Tempo query
      - "9095:9095" # Tempo gRPC
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    networks:
      - go-clean-template

  # Mimir: armazena métricas Prometheus.
  mimir:
    image: grafana/mimir:latest
    ports:
      - "9009:9009"
    volumes:
      - ./mimir-config.yaml:/etc/mimir/mimir-config.yaml:ro
      - mimir-data:/data
    command: -config.file=/etc/mimir/mimir-config.yaml
    networks:
      - go-clean-template

  # Grafana: visualização de logs, traces e métricas.
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_FEATURE_TOGGLES_ENABLE=tempoServiceGraph tempoSearch traceqlEditor
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - go-clean-template

  # Alloy: coleta logs dos containers e envia para Loki.
  alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
    networks:
      - go-clean-template

networks:
  go-clean-template:
    name: go-clean-template

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
  alloy-data:
